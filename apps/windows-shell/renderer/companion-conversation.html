<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Work Companion Conversation</title>
    <link rel="stylesheet" href="./companion-conversation.css" />
    <link rel="stylesheet" href="./companion-structured.css" />
  </head>
  <body>
    <main class="surface" aria-label="Work companion conversation">
      <h1 id="title" class="sr-only">Work companion</h1>
      <section class="console" id="console" aria-label="Terminal controls">
        <button class="button" id="loadOlder" type="button" hidden>Load older messages</button>
        <div class="console-screen" id="consoleScreen" role="log" aria-label="Live terminal screen" tabindex="0"></div>
      </section>
      <button class="button jump-latest" id="jumpLatest" type="button" hidden>Jump to latest</button>
      <div class="requests" id="requests" aria-label="Backend requests" hidden></div>
      <div class="prompt" id="prompt" role="status"></div>
      <div class="submission-status" id="submissionStatus" role="status"></div>
      <div id="uncertainActions" class="request-actions" hidden><button class="button" id="reconnect" type="button">Reconnect to inspect</button><button class="button" id="acknowledgeUnknown" type="button">Keep draft and allow a new send (duplicate risk)</button></div>
      <div class="composer">
        <div class="attachment-row" id="attachments" aria-label="Images attached to the next message" hidden></div>
        <textarea class="draft" id="draft" aria-label="Message the work companion" placeholder="Message the work companion…" rows="2"></textarea>
        <div class="composer-bottom">
          <span class="presence" id="presence" data-phase="offline">Offline</span>
          <select class="backend-select" id="backend" aria-label="Companion backend" aria-describedby="backendReason"><option value="claude">Claude</option><option value="codex">Codex</option></select>
          <span class="hint" title="Ctrl+numpad +/- changes text size; Ctrl+0 resets it. Empty input: arrows, Tab, Esc and Enter control Claude's prompts.">Enter to send · Shift+Enter for a new line · Ctrl +/− text</span>
          <div class="actions"><button class="button" id="start" type="button">Start</button><button class="button" id="attach" type="button" title="Attach images, paste a screenshot, or drop images here">Attach</button><button class="button stop" id="stop" type="button" disabled>Stop</button><button class="button stop" id="shutdown" type="button" title="Disconnect; this day can be resumed later" hidden>Disconnect</button><button class="button" id="endDay" type="button" title="End this day before choosing a new companion backend" hidden>End day</button><button class="button send" id="send" type="button" disabled>Send ↑</button></div>
        </div>
        <p class="backend-reason" id="backendReason" hidden></p>
      </div>
    </main>
    <script type="module" src="./companion-conversation.js"></script>
    <script type="module" src="./design-reload.js"></script>
  </body>
</html>
