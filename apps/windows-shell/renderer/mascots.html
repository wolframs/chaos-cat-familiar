<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chaos Cat Familiar Mascots</title>
    <link rel="stylesheet" href="./brand-tokens.css" />
    <style>

      main {
        max-width: 1040px;
        margin: 0 auto;
        padding: 28px;
      }

      .hero {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 20px;
        align-items: center;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: var(--ccf-shadow);
      }

      .hero-card {
        padding: 24px;
      }

      .hero-card h1 {
        margin: 0;
        font-size: 34px;
      }

      .hero-card p {
        color: var(--muted);
        line-height: 1.5;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      input, button {
        font: inherit;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--ccf-page);
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 11px 16px;
        cursor: pointer;
      }

      .primary {
        background: var(--accent);
        color: white;
      }

      .secondary {
        background: var(--ccf-surface-muted);
        color: var(--ink);
      }

      .preview {
        min-height: 320px;
        padding: 24px;
        display: grid;
        place-items: center;
      }

      .preview img {
        width: min(100%, 260px);
        aspect-ratio: 1;
        object-fit: contain;
        filter: drop-shadow(0 16px 24px rgba(35, 17, 60, 0.14));
      }

      .section {
        margin-top: 24px;
      }

      .section h2 {
        margin: 0 0 12px;
        font-size: 20px;
      }

      .library {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 14px;
      }

      .mascot-card {
        padding: 16px;
      }

      .mascot-card img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: contain;
        border-radius: 16px;
        background: radial-gradient(circle at 30% 20%, rgba(206, 153, 246, 0.18), rgba(206,153,246,0.04) 48%, rgba(35,17,60,0.04) 100%);
      }

      .eyebrow {
        display: inline-flex;
        margin-top: 12px;
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(206, 153, 246, 0.12);
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
      }

      .meta {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .featured {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 10px;
        margin-top: 12px;
      }

      .chip {
        padding: 12px;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: var(--ccf-surface);
        color: var(--ink);
        text-align: left;
      }

      .toolbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 200px;
        gap: 10px;
        margin-top: 20px;
      }
    </style>
    <link rel="stylesheet" href="./utility-window.css" />
  </head>
  <body>
    <header class="window-titlebar">
      <span>Chaos Cat Familiar — Mascots</span>
      <div class="window-controls" role="group" aria-label="Window controls">
        <button id="windowMinimize" data-window-action="minimize" aria-label="Minimize window" title="Minimize">−</button>
        <button id="windowMaximize" data-window-action="toggle-maximize" aria-label="Maximize or restore window" title="Maximize or restore">□</button>
        <button id="windowClose" data-window-action="close" aria-label="Close window" title="Close">×</button>
      </div>
    </header>
    <main>
      <section class="hero">
        <article class="card hero-card">
          <div class="eyebrow">Mascot library</div>
          <h1>Pick a mascot that feels alive.</h1>
          <p>Use the bundled mascot immediately, or install another one from a masko.ai slug. The overlay updates live as soon as you switch.</p>
          <label for="mascotSlug">Install from slug</label>
          <input id="mascotSlug" type="text" placeholder="masko" />
          <div class="meta" style="margin-top:10px;">Quick starts</div>
          <div class="featured" id="featuredMascots"></div>
          <div class="actions" style="margin-top:12px;">
            <button class="primary" id="installMascot">Install mascot</button>
            <button class="secondary" id="openPreview">Preview in action</button>
            <button class="secondary" id="openDiagnostics">Open diagnostics</button>
          </div>
          <div id="mascotStatus" class="meta" style="margin-top:12px;"></div>
        </article>
        <article class="card preview">
          <div>
            <img id="currentMascotImage" alt="Selected mascot" />
            <div style="text-align:center;margin-top:12px;">
              <strong id="currentMascotName">Chaos Cat</strong>
              <div class="meta" id="currentMascotMeta">Bundled default mascot</div>
            </div>
          </div>
        </article>
      </section>

      <section class="section">
        <h2>Installed mascots</h2>
        <div class="toolbar">
          <input id="librarySearch" type="text" placeholder="Search installed mascots" />
          <select id="libraryFilter">
            <option value="all">All sources</option>
            <option value="bundled">Bundled</option>
            <option value="remote">Installed from masko.ai</option>
          </select>
        </div>
        <div class="library" id="mascotLibrary"></div>
      </section>
    </main>
    <script src="./window-controls.js"></script>
    <script type="module" src="./mascots.js"></script>
    <script type="module" src="./design-reload.js"></script>
  </body>
</html>
